{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div
    class="auth-card card shadow-sm mx-auto">
    <div class="card-body p-4">
        <h2>Create account</h2>
        <p class="text-muted">Students are activated immediately. Examiner accounts need admin approval.</p>
        <form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name"
                required><label class="form-label">Email</label><input class="form-control mb-3" type="email"
                name="email" required><label class="form-label">Password (minimum 8 characters)</label><input
                class="form-control mb-3" type="password" name="password" minlength="8" required><label
                class="form-label">Role</label><select class="form-select mb-3" name="role">
                <option value="student">Student</option>
                <option value="examiner">Examiner</option>
            </select><label class="form-label">Phone</label><input class="form-control mb-3" name="phone"><label
                class="form-label">Department (optional)</label><input class="form-control mb-3"
                name="department"><button class="btn btn-primary w-100">Register</button></form>
        <p class="mt-3 mb-0 text-center"><a href="{{ url_for('login') }}">Back to login</a></p>
    </div>
</div>{% endblock %}
