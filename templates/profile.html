{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}<h1>My profile</h1>
<div class="card">
    <div class="card-body">
        <form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name"
                value="{{ user.name }}" required><label class="form-label">Email (cannot be changed)</label><input
                class="form-control mb-3" value="{{ user.email }}" disabled><label
                class="form-label">Phone</label><input class="form-control mb-3" name="phone"
                value="{{ user.phone }}"><label class="form-label">Department</label><input class="form-control mb-3"
                name="department" value="{{ user.department }}"><button class="btn btn-primary">Save profile</button>
        </form>
    </div>
</div>{% endblock %}
