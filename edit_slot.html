{% extends 'base.html' %}{% block title %}Edit Slot{% endblock %}{% block content %}<h1>Edit examination slot</h1>
<form method="post" class="card card-body"><label class="form-label">Date</label><input class="form-control mb-3"
        type="date" name="exam_date" value="{{ slot.exam_date }}" required><label class="form-label">Start
        time</label><input class="form-control mb-3" type="time" name="start_time" value="{{ slot.start_time }}"
        required><label class="form-label">End time</label><input class="form-control mb-3" type="time" name="end_time"
        value="{{ slot.end_time }}" required><label class="form-label">Capacity</label><input class="form-control mb-3"
        type="number" min="1" name="capacity" value="{{ slot.capacity }}" required><button class="btn btn-primary">Save
        slot</button></form>{% endblock %}
